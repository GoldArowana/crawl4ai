name: Codex exact Wayback scan validation
on:
  push:
    branches: [validation/wayback-scan-ownership-e63e45b9]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GoldArowana/crawl4ai
          ref: 0035fb35d60e851a67f3765ddb3bdf3bd48a7b2f
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: unclecode/crawl4ai
          ref: 2c0b9e9cc6a7918314fe53a63693d1c2c6115f5a
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert source and base identity
        run: |
          echo "VALIDATION_EVENT=$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = 0035fb35d60e851a67f3765ddb3bdf3bd48a7b2f
          test "$(git -C source rev-parse HEAD^{tree})" = ad416aa00afc0da0b191c209a524dc25ba2602ec
          test "$(git -C baseline rev-parse HEAD)" = 2c0b9e9cc6a7918314fe53a63693d1c2c6115f5a
          test "$(git -C baseline rev-parse HEAD^{tree})" = 955bb920d29bf201cf927cdb7b10f51787163dbf
          git -C source diff HEAD --exit-code
          git -C baseline diff HEAD --exit-code
      - name: Install declared package and test dependencies
        run: python -m pip install -e ./source pytest pytest-asyncio black
      - name: Run candidate regression against unchanged base
        working-directory: baseline
        run: |
          mkdir "$RUNNER_TEMP/base-regression"
          cp ../source/tests/unit/test_domain_mapper_wayback.py "$RUNNER_TEMP/base-regression/"
          cmp ../source/tests/unit/test_domain_mapper_wayback.py "$RUNNER_TEMP/base-regression/test_domain_mapper_wayback.py"
          set +e
          PYTHONPATH="$PWD" python - <<'PYTEST'
          import crawl4ai, os, pathlib, pytest
          expected = pathlib.Path.cwd() / "crawl4ai" / "__init__.py"
          print("BASE_IMPORT", crawl4ai.__file__)
          assert pathlib.Path(crawl4ai.__file__).resolve() == expected
          workspace = os.environ["RUNNER_TEMP"]
          raise SystemExit(pytest.main([
              workspace + "/base-regression/test_domain_mapper_wayback.py",
              "-q", "--import-mode=importlib",
              "--confcutdir=" + workspace + "/base-regression", "--junitxml=" + workspace + "/base.xml",
          ]))
          PYTEST
          rc=$?
          set -e
          test "$rc" = 1
          python - <<'COUNTS'
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.environ["RUNNER_TEMP"] + "/base.xml")
          rows = root.findall(".//testcase")
          failures = [row for row in rows if row.find("failure") is not None]
          errors = root.findall(".//error")
          assert len(rows) == 5 and len(failures) == 4 and not errors
          assert all(row.attrib["name"].startswith("test_wayback_results_stay_with_the_scan") for row in failures)
          print("BASE_COUNTS", len(rows), len(failures), len(errors))
          COUNTS
          git diff HEAD --exit-code
      - name: Run final source and existing offline mapper tests
        working-directory: source
        run: |
          python -c 'import crawl4ai,pathlib; print("HEAD_IMPORT",crawl4ai.__file__); assert pathlib.Path(crawl4ai.__file__).resolve() == pathlib.Path.cwd() / "crawl4ai" / "__init__.py"'
          python -m pytest -q tests/unit/test_domain_mapper_wayback.py tests/unit/test_domain_mapper_unit.py tests/regression/test_reg_domain_mapper.py -m 'not network'
          python -m black --check --diff tests/unit/test_domain_mapper_wayback.py
          python -m compileall -q crawl4ai/domain_mapper.py tests/unit/test_domain_mapper_wayback.py
      - name: Always verify source stayed clean
        if: always()
        run: |
          test "$(git -C source rev-parse HEAD)" = 0035fb35d60e851a67f3765ddb3bdf3bd48a7b2f
          test "$(git -C source rev-parse HEAD^{tree})" = ad416aa00afc0da0b191c209a524dc25ba2602ec
          test "$(git -C baseline rev-parse HEAD)" = 2c0b9e9cc6a7918314fe53a63693d1c2c6115f5a
          test "$(git -C baseline rev-parse HEAD^{tree})" = 955bb920d29bf201cf927cdb7b10f51787163dbf
          git -C source diff HEAD --exit-code
          git -C baseline diff HEAD --exit-code
